name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BINARY: broominal_windows_amd64.exe
      VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: RELEASE_BODY.md

      - name: Beautify release notes via AI
        if: env.OPENROUTER_API_KEY != ''
        run: |
          $model = "${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash' }}"
          $args = @()
          if ($model) { $args += "-Model", $model }
          Get-Content RELEASE_BODY.md -Raw | pwsh -File scripts/ai-changelog.ps1 @args -OutputFile RELEASE_BODY.md
        shell: pwsh

      - name: Build
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags "-s -w -X main.Version=${{ env.VERSION }}" -o "${{ env.BINARY }}" ./cmd/broominal
        shell: pwsh

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binary
          path: ${{ env.BINARY }}

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '83a8dd1a-54f4-4de1-9607-37cf551b6d2b'
          project-slug: 'broominal'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Generate checksums
        run: |
          $hash = Get-FileHash "signed/${{ env.BINARY }}" -Algorithm SHA256
          "$( $hash.Hash)  ${{ env.BINARY }}" | Out-File -Encoding utf8 checksums.txt
        shell: pwsh

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            signed/${{ env.BINARY }}
            checksums.txt
