name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BINARY: broominal_windows_amd64.exe
      VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: RELEASE_BODY.md

      - name: Beautify release notes via AI
        if: env.OPENROUTER_API_KEY != ''
        run: |
          $model = "${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash' }}"
          $args = @()
          if ($model) { $args += "-Model", $model }
          Get-Content RELEASE_BODY.md -Raw | pwsh -File scripts/ai-changelog.ps1 @args -OutputFile RELEASE_BODY.md
        shell: pwsh

      - name: Build
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags "-s -w -X main.Version=${{ env.VERSION }}" -o "${{ env.BINARY }}" ./cmd/broominal
        shell: pwsh

      - name: Sign with SignPath
        run: |
          $ErrorActionPreference = "Stop"
          $orgId = "83a8dd1a-54f4-4de1-9607-37cf551b6d2b"
          $apiToken = "${{ secrets.SIGNPATH_API_TOKEN }}"
          $baseUri = "https://app.signpath.io/api/v1"
          $binary = "${{ env.BINARY }}"

          Write-Host "Submitting $binary to SignPath..."

          $form = @{
            projectSlug        = "broominal"
            signingPolicySlug  = "release-signing"
            description        = "${{ env.VERSION }}"
            artifact           = (Get-Item $binary)
          }

          $submitResp = Invoke-WebRequest -Uri "$baseUri/$orgId/SigningRequests/SubmitWithArtifact" `
            -Method Post -Form $form -Headers @{ Authorization = "Bearer $apiToken" } `
            -SkipHttpErrorCheck

          if ($submitResp.StatusCode -ne 201) {
            $body = $submitResp.Content
            throw "SignPath submit failed (HTTP $($submitResp.StatusCode)): $body"
          }

          $location = $submitResp.Headers["Location"]
          $signingRequestId = $location -split "/" | Select-Object -Last 1
          Write-Host "Signing request: $signingRequestId"

          # Poll for completion
          $timeout = 600
          $elapsed = 0
          do {
            Start-Sleep -Seconds 5
            $elapsed += 5
            $sr = Invoke-RestMethod -Uri "$baseUri/$orgId/SigningRequests/$signingRequestId" `
              -Headers @{ Authorization = "Bearer $apiToken" }
            Write-Host "Status: $($sr.status) ($elapsed s)"
          } while ($sr.status -ne "Completed" -and $elapsed -lt $timeout)

          if ($sr.status -ne "Completed") {
            throw "Signing did not complete. Final status: $($sr.status)"
          }

          # Download signed artifact
          New-Item -ItemType Directory -Force signed | Out-Null
          Invoke-WebRequest -Uri "$baseUri/$orgId/SigningRequests/$signingRequestId/SignedArtifact" `
            -Headers @{ Authorization = "Bearer $apiToken" } -OutFile "signed/$binary"
          Write-Host "Signed: signed/$binary"
        shell: pwsh

      - name: Generate checksums
        run: |
          $hash = Get-FileHash "signed/${{ env.BINARY }}" -Algorithm SHA256
          "$( $hash.Hash)  ${{ env.BINARY }}" | Out-File -Encoding utf8 checksums.txt
        shell: pwsh

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            signed/${{ env.BINARY }}
            checksums.txt
