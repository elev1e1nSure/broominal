name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          $diff = gofmt -l .
          if ($diff) {
            Write-Output "Unformatted files:"
            Write-Output $diff
            exit 1
          }
        shell: pwsh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Coverage
        run: |
          go test -count=1 ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          $total = go tool cover -func=coverage.out | Select-String -Pattern 'total:' | ForEach-Object {
            $parts = $_.ToString() -split '\s+'
            $percent = [double]$parts[$parts.Length - 1].Replace('%','')
            if ($percent -lt 70) {
              Write-Error "Coverage $percent% is below 70% gate"
            }
          }
        shell: pwsh

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o broominal.exe ./cmd/broominal
      - uses: actions/upload-artifact@v4
        with:
          name: broominal
          path: broominal.exe
